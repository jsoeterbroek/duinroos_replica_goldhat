[env]
platform = espressif32@6.10.0 ; pinned version for compatibility
board = m5stack-cores3
framework = arduino
test_framework = doctest
monitor_speed = 115200
check_tool = clangtidy
check_flags =
  clangtidy: --checks=-*,-cert-*,clang-diagnostic-*,clang-analyzer-* --fix
lib_deps =
	m5stack/M5GFX
	m5stack/M5Unified
build_flags =
  -DCORE_DEBUG_LEVEL=0             ;0:None, 1:Error, 2:Warn, 3:Info, 4:Debug, 5:Verbose
  -DARDUINO_RUNNING_CORE=1         ;0:Core0, 1:Core1(default)
  -DARDUINO_EVENT_RUNNING_CORE=1   ;0:Core0, 1:Core1(default)
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw

[env:m5stack-cores3]
build_flags =
 	${env.build_flags}
  -DM5CORES3
  -DAPP_VERSION=\"0.1.beta\"
